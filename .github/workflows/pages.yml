name: 트렌드 수집 및 Pages 배포

on:
  push:
    branches: [main]
  schedule:
    # 매일 한국 시간 오전 7시 = UTC 22시(전날). cron은 UTC 기준입니다.
    # (GitHub 스케줄은 혼잡하면 수 분~수십 분 늦게 시작될 수 있음)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집 및 정적 사이트 생성
        # 수집 실패 시 이전 스냅샷을 가져올 주소 — 포크한 본인 계정의 Pages 주소로 자동 지정
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 collect.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
